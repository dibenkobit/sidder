name: docs links

on:
  pull_request:
    paths:
      - README.md
      - CONTRIBUTING.md
      - SECURITY.md
      - SUPPORT.md
      - CODE_OF_CONDUCT.md
      - "docs/**"
      - "examples/node-postgres/**"
      - ".github/workflows/docs-links.yml"
  push:
    branches: [main]
    paths:
      - README.md
      - CONTRIBUTING.md
      - SECURITY.md
      - SUPPORT.md
      - CODE_OF_CONDUCT.md
      - "docs/**"
      - "examples/node-postgres/**"
      - ".github/workflows/docs-links.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --max-retries 3
            --retry-wait-time 2
            --timeout 20
            --exclude '^https://www\.npmjs\.com/'
            README.md
            CONTRIBUTING.md
            SECURITY.md
            SUPPORT.md
            CODE_OF_CONDUCT.md
            'docs/**/*.md'
            'examples/node-postgres/README.md'
          fail: true
          token: ${{ secrets.GITHUB_TOKEN }}
